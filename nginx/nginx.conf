upstream hushle_app {
    server app:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# A stream screen's address carries its view key (/stream/<key>): never written to the access log.
map $request_uri $hushle_loggable {
    ~^/stream/ 0;
    default 1;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log main if=$hushle_loggable;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;
    include /etc/nginx/cloudflare-real-ip.conf;
    access_log /var/log/nginx/access.log main if=$hushle_loggable;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # An upstream failure (a 502 while the app restarts) is an `error` line quoting the request,
    # view key included: this location writes only `crit` ones. Proxied like `location /`.
    location ^~ /stream/ {
        error_log /var/log/nginx/error.log crit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://hushle_app;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://hushle_app;
    }
}
