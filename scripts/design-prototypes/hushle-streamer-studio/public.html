<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hushle / Sohbet yarışı</title><link rel="stylesheet" href="public.css"><script src="public.js" defer></script></head>
<body class="dark" data-phase="ready">
  <main class="stage">
    <header class="stage-header"><div class="brand-block"><strong class="brand">HUSHLE</strong><span>SOHBET YARIŞI <b>DEMO</b></span></div><div class="time"><div class="round-meta"><span id="phase">HAZIR</span><span>TUR <b id="round">01</b></span></div><strong id="timer">60</strong><small>sn</small><div class="time-track"><i id="timer-progress"></i></div></div></header>
    <div class="stage-grid">
      <section class="challenge"><div class="card-scene" aria-hidden="true"><div class="ghost-card"></div><div id="visual-back" class="visual-back"><span>H</span></div></div><div class="invitation"><span class="game-label" id="pack-label">TR KELİME PAKETİ</span><h1 id="headline">Tahmin et!</h1><p id="instruction">Yayıncı anlatıyor.<br>Cevabını sohbete yaz.</p></div></section>
      <section class="leaderboard" aria-label="Bu oturumun ilk üç oyuncusu"><div class="board-heading"><div><span>BU OTURUM</span><h2>Top 3</h2></div><span class="board-symbol" aria-hidden="true">#</span></div><ol id="scores"></ol><p id="leader-note">İlk doğru tahminle yarış başlar.</p></section>
    </div>
    <footer class="stage-footer"><div id="last-correct" class="last-correct"><span class="winner-mark" aria-hidden="true">✓</span><div class="last-copy"><span class="label">SON BİLEN</span><strong id="winner">İlk bilen sen ol.</strong><small id="winner-round"></small></div><span id="earned" class="earned" hidden>+1 <small>PUAN</small></span></div><div class="participation"><strong id="participant-count">0</strong><span>kişi katıldı</span></div></footer>
  </main>
</body></html>
