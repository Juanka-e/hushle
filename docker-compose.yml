x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hushle-api
    restart: unless-stopped
    logging: *default-logging
    command: ["npm", "run", "api:start"]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      MOBILE_AUTH_ENABLED: ${MOBILE_AUTH_ENABLED:-false}
      API_TRUST_PROXY: ${API_TRUST_PROXY:-false}
      MOBILE_ACCESS_TOKEN_TTL_MS: ${MOBILE_ACCESS_TOKEN_TTL_MS:-900000}
      MOBILE_REFRESH_TOKEN_TTL_MS: ${MOBILE_REFRESH_TOKEN_TTL_MS:-2592000000}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_CONNECTION_LIMIT: ${API_DATABASE_CONNECTION_LIMIT:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-hushle:production}
      OBSERVABILITY_EXPORT_MODE: ${OBSERVABILITY_EXPORT_MODE:-disabled}
      OBSERVABILITY_EXPORT_URL: ${OBSERVABILITY_EXPORT_URL:-}
      OBSERVABILITY_EXPORT_TOKEN: ${OBSERVABILITY_EXPORT_TOKEN:-}
      OBSERVABILITY_EXPORT_BATCH_SIZE: ${OBSERVABILITY_EXPORT_BATCH_SIZE:-20}
      OBSERVABILITY_EXPORT_QUEUE_LIMIT: ${OBSERVABILITY_EXPORT_QUEUE_LIMIT:-500}
      OBSERVABILITY_EXPORT_FLUSH_INTERVAL_MS: ${OBSERVABILITY_EXPORT_FLUSH_INTERVAL_MS:-5000}
      OBSERVABILITY_EXPORT_TIMEOUT_MS: ${OBSERVABILITY_EXPORT_TIMEOUT_MS:-3000}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    networks:
      - hushle-net

  jobs:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    command: ["npm", "run", "jobs:run", "--", "audit-retention", "execute"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_CONNECTION_LIMIT: ${JOBS_DATABASE_CONNECTION_LIMIT:-3}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-hushle:production}
      SHOPIER_CHECKOUT_MODE: ${SHOPIER_CHECKOUT_MODE:-disabled}
      SHOPIER_WEBHOOK_MODE: ${SHOPIER_WEBHOOK_MODE:-disabled}
      SHOPIER_RECONCILIATION_MODE: ${SHOPIER_RECONCILIATION_MODE:-disabled}
      SHOPIER_REFUND_MODE: ${SHOPIER_REFUND_MODE:-disabled}
      SHOPIER_PERSONAL_ACCESS_TOKEN: ${SHOPIER_PERSONAL_ACCESS_TOKEN:-}
      SHOPIER_WEBHOOK_TOKEN: ${SHOPIER_WEBHOOK_TOKEN:-}
      SHOPIER_ACCOUNT_ID: ${SHOPIER_ACCOUNT_ID:-}
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID:-}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY:-}
      PAYTR_MERCHANT_SALT: ${PAYTR_MERCHANT_SALT:-}
      PAYTR_CHECKOUT_MODE: ${PAYTR_CHECKOUT_MODE:-disabled}
      PAYTR_REFUND_MODE: ${PAYTR_REFUND_MODE:-disabled}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_MERCHANT_ID: ${IYZICO_MERCHANT_ID:-}
      IYZICO_CHECKOUT_MODE: ${IYZICO_CHECKOUT_MODE:-disabled}
      IYZICO_WEBHOOK_MODE: ${IYZICO_WEBHOOK_MODE:-disabled}
      IYZICO_RECONCILIATION_MODE: ${IYZICO_RECONCILIATION_MODE:-disabled}
      IYZICO_OWNER_CHECKOUT_MODE: ${IYZICO_OWNER_CHECKOUT_MODE:-disabled}
      IYZICO_CALLBACK_MODE: ${IYZICO_CALLBACK_MODE:-disabled}
      IYZICO_SANDBOX_ACCEPTANCE_RECORDED: ${IYZICO_SANDBOX_ACCEPTANCE_RECORDED:-false}
      IYZICO_SANDBOX_ACCEPTANCE_EVIDENCE_SHA256: ${IYZICO_SANDBOX_ACCEPTANCE_EVIDENCE_SHA256:-}
      PAYMENT_WEBHOOK_BATCH_SIZE: ${PAYMENT_WEBHOOK_BATCH_SIZE:-25}
      PAYMENT_WEBHOOK_MAX_ATTEMPTS: ${PAYMENT_WEBHOOK_MAX_ATTEMPTS:-8}
      PAYMENT_WEBHOOK_CLAIM_TTL_MS: ${PAYMENT_WEBHOOK_CLAIM_TTL_MS:-300000}
      PAYMENT_WEBHOOK_JOB_LEASE_TTL_MS: ${PAYMENT_WEBHOOK_JOB_LEASE_TTL_MS:-300000}
      PAYMENT_RECONCILIATION_BATCH_SIZE: ${PAYMENT_RECONCILIATION_BATCH_SIZE:-25}
      PAYMENT_RECONCILIATION_MIN_AGE_MINUTES: ${PAYMENT_RECONCILIATION_MIN_AGE_MINUTES:-30}
      PAYMENT_RECONCILIATION_RETRY_DELAY_MINUTES: ${PAYMENT_RECONCILIATION_RETRY_DELAY_MINUTES:-15}
      PAYMENT_RECONCILIATION_MAX_ATTEMPTS: ${PAYMENT_RECONCILIATION_MAX_ATTEMPTS:-12}
      PAYMENT_RECONCILIATION_JOB_LEASE_TTL_MS: ${PAYMENT_RECONCILIATION_JOB_LEASE_TTL_MS:-300000}
      PAYMENT_DEAD_LETTER_ALERT_THRESHOLD: ${PAYMENT_DEAD_LETTER_ALERT_THRESHOLD:-10}
      PAYMENT_OPEN_CASE_ALERT_THRESHOLD: ${PAYMENT_OPEN_CASE_ALERT_THRESHOLD:-25}
      OBSERVABILITY_EXPORT_MODE: ${OBSERVABILITY_EXPORT_MODE:-disabled}
      OBSERVABILITY_EXPORT_URL: ${OBSERVABILITY_EXPORT_URL:-}
      OBSERVABILITY_EXPORT_TOKEN: ${OBSERVABILITY_EXPORT_TOKEN:-}
      OBSERVABILITY_EXPORT_BATCH_SIZE: ${OBSERVABILITY_EXPORT_BATCH_SIZE:-20}
      OBSERVABILITY_EXPORT_QUEUE_LIMIT: ${OBSERVABILITY_EXPORT_QUEUE_LIMIT:-500}
      OBSERVABILITY_EXPORT_FLUSH_INTERVAL_MS: ${OBSERVABILITY_EXPORT_FLUSH_INTERVAL_MS:-5000}
      OBSERVABILITY_EXPORT_TIMEOUT_MS: ${OBSERVABILITY_EXPORT_TIMEOUT_MS:-3000}
      JOBS_ENABLED: ${JOBS_ENABLED:-false}
      AUDIT_HOT_RETENTION_DAYS: ${AUDIT_HOT_RETENTION_DAYS:-90}
      AUDIT_ARCHIVE_BATCH_SIZE: ${AUDIT_ARCHIVE_BATCH_SIZE:-500}
      MOBILE_AUTH_RETENTION_DAYS: ${MOBILE_AUTH_RETENTION_DAYS:-30}
      MOBILE_AUTH_REUSE_EVIDENCE_DAYS: ${MOBILE_AUTH_REUSE_EVIDENCE_DAYS:-7}
      MOBILE_AUTH_RETENTION_BATCH_SIZE: ${MOBILE_AUTH_RETENTION_BATCH_SIZE:-500}
      MOBILE_AUTH_RETENTION_LEASE_TTL_MS: ${MOBILE_AUTH_RETENTION_LEASE_TTL_MS:-300000}
      AUDIT_ARCHIVE_MAX_BATCHES: ${AUDIT_ARCHIVE_MAX_BATCHES:-10}
      AUDIT_ARCHIVE_LEASE_TTL_MS: ${AUDIT_ARCHIVE_LEASE_TTL_MS:-900000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TOKEN_SECRET: ${EMAIL_TOKEN_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      EMAIL_DELIVERY_BATCH_SIZE: ${EMAIL_DELIVERY_BATCH_SIZE:-25}
      EMAIL_DELIVERY_LEASE_TTL_MS: ${EMAIL_DELIVERY_LEASE_TTL_MS:-900000}
      EMAIL_SENT_RETENTION_DAYS: ${EMAIL_SENT_RETENTION_DAYS:-30}
      EMAIL_DEAD_LETTER_RETENTION_DAYS: ${EMAIL_DEAD_LETTER_RETENTION_DAYS:-90}
      EMAIL_TOKEN_RETENTION_DAYS: ${EMAIL_TOKEN_RETENTION_DAYS:-7}
      EMAIL_PENDING_ACCOUNT_RETENTION_DAYS: ${EMAIL_PENDING_ACCOUNT_RETENTION_DAYS:-7}
      EMAIL_RETENTION_BATCH_SIZE: ${EMAIL_RETENTION_BATCH_SIZE:-500}
      EMAIL_RETENTION_LEASE_TTL_MS: ${EMAIL_RETENTION_LEASE_TTL_MS:-300000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hushle-net

  migrate:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    command: ["npm", "run", "db:migrate:deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hushle-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hushle-app
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-20}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      TRUSTED_WEB_ORIGINS: ${TRUSTED_WEB_ORIGINS:-}
      ALLOW_ORIGINLESS_SOCKET_CLIENTS: ${ALLOW_ORIGINLESS_SOCKET_CLIENTS:-false}
      STATE_CHANGE_ORIGIN_POLICY: ${STATE_CHANGE_ORIGIN_POLICY:-strict}
      CSP_STYLE_SOURCES: ${CSP_STYLE_SOURCES:-}
      CSP_FONT_SOURCES: ${CSP_FONT_SOURCES:-}
      CSP_CONNECT_SOURCES: ${CSP_CONNECT_SOURCES:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      HEALTHCHECK_TOKEN: ${HEALTHCHECK_TOKEN}
      OBSERVABILITY_EXPORT_MODE: ${OBSERVABILITY_EXPORT_MODE:-disabled}
      OBSERVABILITY_EXPORT_URL: ${OBSERVABILITY_EXPORT_URL:-}
      OBSERVABILITY_EXPORT_TOKEN: ${OBSERVABILITY_EXPORT_TOKEN:-}
      OBSERVABILITY_EXPORT_BATCH_SIZE: ${OBSERVABILITY_EXPORT_BATCH_SIZE:-20}
      OBSERVABILITY_EXPORT_QUEUE_LIMIT: ${OBSERVABILITY_EXPORT_QUEUE_LIMIT:-500}
      OBSERVABILITY_EXPORT_FLUSH_INTERVAL_MS: ${OBSERVABILITY_EXPORT_FLUSH_INTERVAL_MS:-5000}
      OBSERVABILITY_EXPORT_TIMEOUT_MS: ${OBSERVABILITY_EXPORT_TIMEOUT_MS:-3000}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMENT_ACTIVE_PROVIDER: ${PAYMENT_ACTIVE_PROVIDER:-}
      SHOPIER_PERSONAL_ACCESS_TOKEN: ${SHOPIER_PERSONAL_ACCESS_TOKEN:-}
      SHOPIER_PRODUCT_MEDIA_URL: ${SHOPIER_PRODUCT_MEDIA_URL:-}
      SHOPIER_CHECKOUT_MODE: ${SHOPIER_CHECKOUT_MODE:-disabled}
      SHOPIER_WEBHOOK_MODE: ${SHOPIER_WEBHOOK_MODE:-disabled}
      SHOPIER_RECONCILIATION_MODE: ${SHOPIER_RECONCILIATION_MODE:-disabled}
      SHOPIER_REFUND_MODE: ${SHOPIER_REFUND_MODE:-disabled}
      SHOPIER_WEBHOOK_TOKEN: ${SHOPIER_WEBHOOK_TOKEN:-}
      SHOPIER_ACCOUNT_ID: ${SHOPIER_ACCOUNT_ID:-}
      SHOPIER_LIVE_ACCEPTANCE_RECORDED: ${SHOPIER_LIVE_ACCEPTANCE_RECORDED:-false}
      SHOPIER_LIVE_ACCEPTANCE_EVIDENCE_FILE: ${SHOPIER_LIVE_ACCEPTANCE_EVIDENCE_FILE:-}
      SHOPIER_LIVE_ACCEPTANCE_EVIDENCE_SHA256: ${SHOPIER_LIVE_ACCEPTANCE_EVIDENCE_SHA256:-}
      PAYTR_CHECKOUT_MODE: ${PAYTR_CHECKOUT_MODE:-disabled}
      PAYTR_REFUND_MODE: ${PAYTR_REFUND_MODE:-disabled}
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID:-}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY:-}
      PAYTR_MERCHANT_SALT: ${PAYTR_MERCHANT_SALT:-}
      PAYTR_SANDBOX_USER_IP: ${PAYTR_SANDBOX_USER_IP:-}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_MERCHANT_ID: ${IYZICO_MERCHANT_ID:-}
      IYZICO_CHECKOUT_MODE: ${IYZICO_CHECKOUT_MODE:-disabled}
      IYZICO_WEBHOOK_MODE: ${IYZICO_WEBHOOK_MODE:-disabled}
      IYZICO_RECONCILIATION_MODE: ${IYZICO_RECONCILIATION_MODE:-disabled}
      IYZICO_OWNER_CHECKOUT_MODE: ${IYZICO_OWNER_CHECKOUT_MODE:-disabled}
      IYZICO_CALLBACK_MODE: ${IYZICO_CALLBACK_MODE:-disabled}
      IYZICO_SANDBOX_ACCEPTANCE_RECORDED: ${IYZICO_SANDBOX_ACCEPTANCE_RECORDED:-false}
      IYZICO_SANDBOX_ACCEPTANCE_EVIDENCE_SHA256: ${IYZICO_SANDBOX_ACCEPTANCE_EVIDENCE_SHA256:-}
      PAYMENT_OPEN_CASE_ALERT_THRESHOLD: ${PAYMENT_OPEN_CASE_ALERT_THRESHOLD:-25}
      PAYMENT_DEAD_LETTER_ALERT_THRESHOLD: ${PAYMENT_DEAD_LETTER_ALERT_THRESHOLD:-10}
      PAYMENT_WEBHOOK_SCHEDULE_CONFIGURED: ${PAYMENT_WEBHOOK_SCHEDULE_CONFIGURED:-false}
      PAYMENT_WEBHOOK_SCHEDULE_MAX_AGE_SECONDS: ${PAYMENT_WEBHOOK_SCHEDULE_MAX_AGE_SECONDS:-180}
      PAYMENT_RECONCILIATION_SCHEDULE_CONFIGURED: ${PAYMENT_RECONCILIATION_SCHEDULE_CONFIGURED:-false}
      PAYMENT_RECONCILIATION_SCHEDULE_MAX_AGE_SECONDS: ${PAYMENT_RECONCILIATION_SCHEDULE_MAX_AGE_SECONDS:-1800}
      PAYMENT_LEGAL_APPROVED: ${PAYMENT_LEGAL_APPROVED:-false}
      PAYMENT_LEGAL_APPROVAL_EVIDENCE_SHA256: ${PAYMENT_LEGAL_APPROVAL_EVIDENCE_SHA256:-}
      PAYMENT_ROLLOUT_SEED: ${PAYMENT_ROLLOUT_SEED:-}
      PAYMENT_LEGAL_BUSINESS_NAME: ${PAYMENT_LEGAL_BUSINESS_NAME:-}
      PAYMENT_LEGAL_BUSINESS_ADDRESS: ${PAYMENT_LEGAL_BUSINESS_ADDRESS:-}
      PAYMENT_LEGAL_CONTACT_EMAIL: ${PAYMENT_LEGAL_CONTACT_EMAIL:-}
      PAYMENT_CHECKOUT_TERMS_VERSION: ${PAYMENT_CHECKOUT_TERMS_VERSION:-}
      PAYMENT_PRIVACY_NOTICE_VERSION: ${PAYMENT_PRIVACY_NOTICE_VERSION:-}
      PAYMENT_DISTANCE_SALES_NOTICE_VERSION: ${PAYMENT_DISTANCE_SALES_NOTICE_VERSION:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TOKEN_SECRET: ${EMAIL_TOKEN_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      PRODUCTION_EMAIL_FEEDBACK_POLICY: ${PRODUCTION_EMAIL_FEEDBACK_POLICY:-disabled}
      SES_FEEDBACK_WEBHOOK_ENABLED: ${SES_FEEDBACK_WEBHOOK_ENABLED:-false}
      SES_SNS_TOPIC_ARNS: ${SES_SNS_TOPIC_ARNS:-}
      SES_ALLOWED_SOURCE_ARNS: ${SES_ALLOWED_SOURCE_ARNS:-}
      SES_SNS_AUTO_CONFIRM: ${SES_SNS_AUTO_CONFIRM:-false}
      SES_FEEDBACK_WEBHOOK_RATE_LIMIT_PER_MINUTE: ${SES_FEEDBACK_WEBHOOK_RATE_LIMIT_PER_MINUTE:-600}
      ADMIN_ACCESS_MODE: ${ADMIN_ACCESS_MODE:-restricted_login}
      ADMIN_ACCESS_FAIL_CLOSED: ${ADMIN_ACCESS_FAIL_CLOSED:-true}
      ADMIN_ACCESS_ALLOW_LOCAL_DEV_BYPASS: ${ADMIN_ACCESS_ALLOW_LOCAL_DEV_BYPASS:-false}
      ADMIN_ACCESS_HEADER_NAME: ${ADMIN_ACCESS_HEADER_NAME:-}
      ADMIN_ACCESS_HEADER_VALUE: ${ADMIN_ACCESS_HEADER_VALUE:-}
      ADMIN_ACCESS_EMAIL_HEADER_NAME: ${ADMIN_ACCESS_EMAIL_HEADER_NAME:-}
      ADMIN_ACCESS_ALLOWED_EMAILS: ${ADMIN_ACCESS_ALLOWED_EMAILS:-}
      ADMIN_ACCESS_ALLOWED_EMAIL_DOMAINS: ${ADMIN_ACCESS_ALLOWED_EMAIL_DOMAINS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-hushle:production}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-3000}
      REDIS_RETRY_COOLDOWN_MS: ${REDIS_RETRY_COOLDOWN_MS:-30000}
      INSTANCE_ID: ${INSTANCE_ID:-hushle-app-1}
      REALTIME_TOPOLOGY: ${REALTIME_TOPOLOGY:-single-writer}
      REALTIME_REPLICA_COUNT: ${REALTIME_REPLICA_COUNT:-1}
      SOCKET_IO_POLLING_ENABLED: ${SOCKET_IO_POLLING_ENABLED:-true}
      SOCKET_IO_REDIS_ADAPTER_ENABLED: ${SOCKET_IO_REDIS_ADAPTER_ENABLED:-false}
      SOCKET_IO_STICKY_SESSIONS_CONFIGURED: ${SOCKET_IO_STICKY_SESSIONS_CONFIGURED:-false}
      ROOM_OWNERSHIP_LEASE_ENABLED: ${ROOM_OWNERSHIP_LEASE_ENABLED:-false}
      ROOM_OWNERSHIP_LEASE_TTL_MS: ${ROOM_OWNERSHIP_LEASE_TTL_MS:-30000}
      ROOM_OWNERSHIP_RENEW_INTERVAL_MS: ${ROOM_OWNERSHIP_RENEW_INTERVAL_MS:-10000}
      MATCH_FINALIZE_TELEMETRY_ROLLUP_ENABLED: ${MATCH_FINALIZE_TELEMETRY_ROLLUP_ENABLED:-true}
      TELEMETRY_ROLLUP_RETENTION_DAYS: ${TELEMETRY_ROLLUP_RETENTION_DAYS:-45}
      PRODUCT_ANALYTICS_ENABLED: ${PRODUCT_ANALYTICS_ENABLED:-false}
      PRODUCT_ANALYTICS_RETENTION_DAYS: ${PRODUCT_ANALYTICS_RETENTION_DAYS:-45}
      WORD_ANALYTICS_ENABLED: ${WORD_ANALYTICS_ENABLED:-false}
      WORD_ANALYTICS_RETENTION_DAYS: ${WORD_ANALYTICS_RETENTION_DAYS:-45}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - hushle-net

  mysql:
    image: mysql:8.4
    container_name: hushle-mysql
    restart: unless-stopped
    logging: *default-logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hushle}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-hushle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hushle-net

  redis:
    image: redis:7-alpine
    container_name: hushle-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hushle-net

  nginx:
    image: nginx:1.27-alpine
    container_name: hushle-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - hushle-net

volumes:
  mysql-data:
  redis-data:

networks:
  hushle-net:
    driver: bridge
