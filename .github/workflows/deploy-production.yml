name: Deploy Production

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  # Manual runs are accepted only from main (see the job conditions), so the
  # release gate and this workflow are the reviewed versions.
  workflow_dispatch:
    inputs:
      action:
        description: "redeploy: deploy a commit that already passed CI on main. rollback: switch the server back to its previous release."
        type: choice
        options:
          - redeploy
          - rollback
        default: redeploy
      sha:
        description: "Full 40-character commit SHA to redeploy (ignored for rollback)"
        type: string
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.action == 'redeploy')
    name: Deploy to Ubuntu 24.04
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}

    steps:
      - name: Reject superseded release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$latest_sha" != "$RELEASE_SHA" ]; then
            echo "This CI result was superseded by a newer main commit; refusing an older deploy."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Manual runs check out main first: the gate below must not come from
          # the commit it judges.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

      - name: Require a commit that passed CI on main
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ops/release-gate.sh "$RELEASE_SHA"
          git checkout --quiet --detach "$RELEASE_SHA"

      - name: Create release archive
        run: |
          printf '%s\n' "$RELEASE_SHA" > .release-sha
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=backups \
            -czf "$RUNNER_TEMP/hushle-release.tgz" .
          (
            cd "$RUNNER_TEMP"
            sha256sum hushle-release.tgz > hushle-release.tgz.sha256
          )

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' '${{ secrets.PROD_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p '${{ secrets.PROD_PORT }}' '${{ secrets.PROD_HOST }}' >> ~/.ssh/known_hosts

      - name: Upload release archive
        run: |
          scp -P '${{ secrets.PROD_PORT }}' "$RUNNER_TEMP/hushle-release.tgz" '${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/hushle-release.tgz'
          scp -P '${{ secrets.PROD_PORT }}' "$RUNNER_TEMP/hushle-release.tgz.sha256" '${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/hushle-release.tgz.sha256'

      - name: Deploy on server
        run: |
          ssh -p '${{ secrets.PROD_PORT }}' '${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}' <<'EOF'
          set -euo pipefail
          cd '${{ secrets.PROD_DEPLOY_PATH }}'
          sha256sum -c hushle-release.tgz.sha256
          tar -xzf hushle-release.tgz
          rm -f hushle-release.tgz hushle-release.tgz.sha256
          chmod +x \
            scripts/ops/deploy.sh \
            scripts/ops/mysql-backup.sh \
            scripts/ops/mysql-restore.sh \
            scripts/ops/run-payment-job.sh \
            scripts/ops/install-payment-schedulers.sh
          ./scripts/ops/deploy.sh
          EOF

  rollback:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'rollback'
    name: Roll back to the previous release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' '${{ secrets.PROD_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p '${{ secrets.PROD_PORT }}' '${{ secrets.PROD_HOST }}' >> ~/.ssh/known_hosts

      # The server keeps the previous release's images; nothing is built or migrated.
      - name: Roll back on server
        run: |
          ssh -p '${{ secrets.PROD_PORT }}' '${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}' <<'EOF'
          set -euo pipefail
          cd '${{ secrets.PROD_DEPLOY_PATH }}'
          bash scripts/ops/deploy.sh rollback
          bash scripts/ops/deploy.sh status
          EOF
