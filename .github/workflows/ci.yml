name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── 1. Lint & Type Check ─────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/tabu_test"

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Test persistent storage and backups
        run: |
          npm run test:persistent-assets
          npm run test:data-backup
          npm run test:offsite-backups

      - name: Test mobile API foundation
        run: npm run test:mobile-api

      - name: Test SES feedback webhook security
        run: |
          npm run test:ses-feedback-webhook
          npm run test:ses-feedback-route

      - name: Test deploy, rollback and release gate
        run: |
          npm run test:deploy-rollback
          bash -n scripts/ops/deploy.sh
          bash -n scripts/ops/lib/release.sh
          bash -n scripts/ops/release-gate.sh

  # ─── 2. Build Check ───────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      DATABASE_URL: "mysql://root:root@localhost:3306/tabu_test"
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NODE_ENV: "production"
      WORD_POOL_SIZE: "120"
      ADMIN_TIMEOUT_MS: "180000"
      RATE_LIMIT_ENABLED: "true"
      ROOM_JOIN_MAX_ATTEMPTS: "5"
      ROOM_JOIN_WINDOW_SECONDS: "60"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tabu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Generate Prisma Client & deploy migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Test Prisma migration contract
        run: npm run test:prisma-migrations

      - name: Test word pool against MySQL
        run: npm run test:word-pool-integration
        env:
          WORD_POOL_INTEGRATION_TEST: "true"

      - name: Test wallet ledger concurrency
        run: |
          npm run test:wallet-ledger-integration
          npm run test:wallet-first-open-integration
          npm run test:wallet-concurrency-integration
        env:
          WALLET_CONCURRENCY_INTEGRATION_TEST: "true"
          WALLET_FIRST_OPEN_INTEGRATION_TEST: "true"
          WALLET_LEDGER_INTEGRATION_TEST: "true"

      - name: Test server-side match settlement
        run: npm run test:match-settlement-integration
        env:
          MATCH_SETTLEMENT_INTEGRATION_TEST: "true"

      - name: Test guest match claims
        run: npm run test:guest-match-claim-integration
        env:
          GUEST_MATCH_CLAIM_INTEGRATION_TEST: "true"

      - name: Test localized notifications
        run: npm run test:notification-locale-integration
        env:
          NOTIFICATION_LOCALE_INTEGRATION_TEST: "true"

      - name: Test guest claim analytics
        run: npm run test:guest-claim-analytics-integration
        env:
          GUEST_CLAIM_ANALYTICS_INTEGRATION_TEST: "true"

      - name: Test payment fulfillment concurrency
        run: |
          npm run test:economy-grant-contract
          npm run test:payment-fulfillment-integration
        env:
          PAYMENT_FULFILLMENT_INTEGRATION_TEST: "true"

      - name: Test payment contracts and provider spec vectors
        run: |
          npm run test:payment-orders
          npm run test:payment-webhook
          npm run test:payment-checkout
          npm run test:payment-fulfillment
          npm run test:payment-paytr-adapter
          npm run test:payment-paytr-checkout
          npm run test:payment-paytr-webhook
          npm run test:payment-iyzico-sandbox-acceptance
          npm run test:payment-provider-spec-vectors

      - name: Test payment orders, checkout and webhook inbox persistence
        run: |
          npm run test:payment-orders-integration
          npm run test:payment-checkout-integration
          npm run test:payment-webhook-integration
          npm run test:payment-iyzico-sandbox-acceptance-integration
        env:
          PAYMENT_ORDERS_INTEGRATION_TEST: "true"
          PAYMENT_CHECKOUT_INTEGRATION_TEST: "true"
          PAYMENT_WEBHOOK_INTEGRATION_TEST: "true"
          IYZICO_ACCEPTANCE_INTEGRATION_TEST: "true"

      - name: Test payment provider adapters and checkout orchestration
        run: |
          npm run test:payment-iyzico-adapter
          npm run test:payment-iyzico-buyer-data
          npm run test:payment-iyzico-checkout-integration
          npm run test:payment-iyzico-webhook
          npm run test:payment-iyzico-owner-surface
          npm run test:payment-stripe-adapter
          npm run test:payment-shopier-adapter
          npm run test:payment-shopier-refund
          npm run test:payment-shopier-live-acceptance
          npm run test:payment-shopier-webhook
          npm run test:payment-paytr-refund
          npm run test:payment-paytr-refund-acceptance
          npm run test:payment-paytr-checkout-integration
          npm run test:payment-shopier-checkout-integration
        env:
          PAYTR_CHECKOUT_INTEGRATION_TEST: "true"
          IYZICO_CHECKOUT_INTEGRATION_TEST: "true"
          SHOPIER_CHECKOUT_INTEGRATION_TEST: "true"

      - name: Test payment webhook processors
        run: |
          npm run test:payment-paytr-webhook-integration
          npm run test:payment-iyzico-webhook-integration
          npm run test:payment-iyzico-owner-callback-integration
          npm run test:payment-shopier-webhook-integration
        env:
          PAYTR_WEBHOOK_PROCESSOR_INTEGRATION_TEST: "true"
          IYZICO_WEBHOOK_PROCESSOR_INTEGRATION_TEST: "true"
          IYZICO_OWNER_CALLBACK_INTEGRATION_TEST: "true"
          SHOPIER_WEBHOOK_PROCESSOR_INTEGRATION_TEST: "true"

      - name: Test payment reconciliation and reversal
        run: |
          npm run test:payment-iyzico-reconciliation-integration
          npm run test:payment-shopier-reconciliation-integration
          npm run test:payment-reconciliation-reversal
          npm run test:payment-reconciliation-reversal-integration
          npm run test:payment-provider-refund-integration
        env:
          IYZICO_RECONCILIATION_INTEGRATION_TEST: "true"
          SHOPIER_RECONCILIATION_INTEGRATION_TEST: "true"
          PAYMENT_REVERSAL_INTEGRATION_TEST: "true"
          PAYMENT_PROVIDER_REFUND_INTEGRATION_TEST: "true"

      - name: Test paid coin provenance and manual review
        run: |
          npm run test:payment-coin-lot
          npm run test:payment-manual-review
          npm run test:payment-coin-lot-integration
        env:
          PAYMENT_COIN_LOT_INTEGRATION_TEST: "true"

      - name: Test payment scheduler observability
        run: |
          npm run test:payment-operations-readiness
          npm run test:payment-operations-readiness-redis
          npm run test:payment-scheduler-deployment
          npm run test:payment-scheduler-deployment-shell
          npm run test:payment-activation-evidence
          npm run test:payment-checkout-rollout
          npm run test:payment-checkout-control-integration
          bash -n scripts/ops/run-payment-job.sh
          bash -n scripts/ops/check-payment-health.sh
          bash -n scripts/ops/install-payment-schedulers.sh
        env:
          REDIS_URL: "redis://localhost:6379"
          REDIS_KEY_PREFIX: "hushle:ci"
          PAYMENT_CHECKOUT_CONTROL_INTEGRATION_TEST: "true"

      - name: Build Next.js
        run: npm run build

      - name: Test admin payment operations UI
        run: npm run test:payment-operations-admin-e2e
        env:
          PAYMENT_OPERATIONS_ADMIN_E2E: "true"
          ADMIN_ACCESS_MODE: "public_login"
          ADMIN_ACCESS_FAIL_CLOSED: "false"

      - name: Test admin integration readiness UI
        run: npm run test:payment-integrations-admin-e2e
        env:
          PAYMENT_INTEGRATIONS_ADMIN_E2E: "true"
          ADMIN_ACCESS_MODE: "public_login"
          ADMIN_ACCESS_FAIL_CLOSED: "false"

      - name: Test connection pause panel and Admin Lab UI
        run: npm run test:connection-pause-ui-e2e
        env:
          CONNECTION_PAUSE_UI_E2E: "true"
          CONNECTION_PAUSE_GRACE_SECONDS: "5"
          ADMIN_ACCESS_MODE: "public_login"
          ADMIN_ACCESS_FAIL_CLOSED: "false"
          ROOM_JOIN_MAX_ATTEMPTS: "100"
          PLAYWRIGHT_REDIS_URL: "redis://localhost:6379"
          REDIS_KEY_PREFIX: "hushle:ci-pause-ui"

      - name: Test guest match claim UI
        run: npm run test:guest-match-claim-ui-e2e
        env:
          GUEST_CLAIM_UI_E2E: "true"
          ROOM_JOIN_MAX_ATTEMPTS: "100"
          PLAYWRIGHT_REDIS_URL: "redis://localhost:6379"
          REDIS_KEY_PREFIX: "hushle:ci-guest-claim-ui"

      - name: Test room join handoff
        run: npm run test:room-join-handoff-e2e
        env:
          ROOM_JOIN_HANDOFF_E2E: "true"
          ROOM_JOIN_MAX_ATTEMPTS: "100"
          PLAYWRIGHT_REDIS_URL: "redis://localhost:6379"
          REDIS_KEY_PREFIX: "hushle:ci-room-join-handoff"

      - name: Test notification list locale
        run: npm run test:notifications-locale-e2e
        env:
          WEB_LAUNCH_DB_E2E: "true"
          PLAYWRIGHT_REDIS_URL: "redis://localhost:6379"
          REDIS_KEY_PREFIX: "hushle:ci-notifications-locale"

      - name: Test settings preferences and admin deep links
        run: npm run test:dashboard-deep-state-e2e
        env:
          WEB_LAUNCH_DB_E2E: "true"
          ADMIN_ACCESS_MODE: "public_login"
          ADMIN_ACCESS_FAIL_CLOSED: "false"
          PLAYWRIGHT_REDIS_URL: "redis://localhost:6379"
          REDIS_KEY_PREFIX: "hushle:ci-dashboard-deep-state"

      - name: Test payment checkout UI
        run: npm run test:payment-checkout-e2e
        env:
          PAYMENT_CHECKOUT_E2E: "true"

      - name: Test Iyzico owner checkout surface
        run: npm run test:payment-iyzico-owner-e2e

      - name: Test strict state-change origin policy
        run: npm run test:request-origin-integration

      - name: Test web launch readiness
        run: npm run test:web-launch-readiness
        env:
          WEB_LAUNCH_DB_E2E: "true"

  # ─── 3. Offsite Backup E2E ────────────────────────────────────────
  # Runs the production backup scripts against MinIO and a real MySQL server.
  # MinIO is started by the scenario inside the same Compose project as the
  # ops backup-cli container, which reaches it at http://minio:9000.
  remote-backup-e2e:
    name: Remote Backup E2E (MinIO)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Anonymous pulls from Docker Hub and public.ecr.aws hit per-IP limits on
      # shared runners, so every image of this job (the MySQL server included,
      # which is why it is not a service container) comes from the Actions cache.
      - name: List scenario images
        id: images
        run: |
          bash scripts/test-remote-backup-e2e.sh --print-images > "$RUNNER_TEMP/backup-e2e-images.txt"
          cat "$RUNNER_TEMP/backup-e2e-images.txt"
          echo "key=backup-e2e-images-$(sha256sum "$RUNNER_TEMP/backup-e2e-images.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore cached images
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/backup-e2e-images
          key: ${{ steps.images.outputs.key }}

      - name: Load or pull scenario images
        run: bash scripts/ci/docker-image-cache.sh ~/backup-e2e-images < "$RUNNER_TEMP/backup-e2e-images.txt"
        env:
          # AWS publishes the same aws-cli build on Docker Hub; the manifest list
          # digest is identical on both registries. Update it together with the
          # BACKUP_AWS_CLI_IMAGE default in docker-compose.ops.yml (a stale entry
          # no longer matches and is ignored).
          DOCKER_IMAGE_MIRRORS: >-
            public.ecr.aws/aws-cli/aws-cli:2.36.10=docker.io/amazon/aws-cli:2.36.10@sha256:1ce4fd2ea9b640019af76a94e91adeed901d20363b4bb2ed095b45c75e5565cc

      - name: Save image cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/backup-e2e-images
          key: ${{ steps.images.outputs.key }}

      - name: Start MySQL server
        run: |
          docker run -d --name backup-e2e-mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root mysql:8.4
          # TCP ping: the entrypoint's init server runs without networking, so
          # this only succeeds once the real server accepts connections.
          for attempt in $(seq 1 60); do
            if docker exec backup-e2e-mysql mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          docker logs backup-e2e-mysql
          exit 1

      - name: Back up, upload, list, download and restore through MinIO
        run: bash scripts/test-remote-backup-e2e.sh --run
        env:
          E2E_IMAGES_PRELOADED: "true"
          E2E_MYSQL_HOST: host.docker.internal
          E2E_MYSQL_PORT: "3306"
          E2E_MYSQL_ADMIN_PASSWORD: root
