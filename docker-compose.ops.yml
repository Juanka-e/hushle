services:
  backup-cli:
    profiles: ["ops"]
    image: ${BACKUP_AWS_CLI_IMAGE:-public.ecr.aws/aws-cli/aws-cli:2.36.10}
    user: "${BACKUP_OPS_UID:-1000}:${BACKUP_OPS_GID:-1000}"
    environment:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
      AWS_REGION: ${BACKUP_S3_REGION:-auto}
      AWS_EC2_METADATA_DISABLED: "true"
      HOME: /tmp
    volumes:
      - ./backups:/backups
